name: minecraft

# every download is pinned to one version, so a restart never pulls in something new by surprise.
# to update: change the version here on purpose (Dependabot opens a PR for the image tags).
#   fabricproxy-lite nR8AIdvx = v2.11.0 (for 1.21.11) · fabric loader 0.20.1
x-fabric-proxy-env: &fabric-proxy-env
  VELOCITY_FORWARDING_SECRET: "${VELOCITY_SECRET:?velocity secret required}"
  FABRIC_PROXY_SECRET: "${VELOCITY_SECRET:?velocity secret required}"
  FABRIC_LOADER_VERSION: "0.20.1"
  MODRINTH_PROJECTS: |
    fabricproxy-lite:nR8AIdvx

configs:
  velocity-toml:
    content: |
      config-version = "2.9"
      bind = "0.0.0.0:25565"
      motd = "<#09add3>DS Network [1.7/26.2]"
      show-max-players = 20
      online-mode = true
      force-key-authentication = true
      prevent-client-proxy-connections = false
      player-info-forwarding-mode = "modern"
      forwarding-secret-file = "forwarding.secret"
      announce-forge = false
      kick-existing-players = false
      enable-player-address-logging = true

      [servers]
      limbo = "mc-limbo:25565"
      survival = "mc-survival:25565"
      survival-old = "mc-survival-old:25565"
      anarchy = "mc-anarchy:25565"
      try = ["limbo"]

      [forced-hosts]

      [advanced]
      compression-threshold = 256
      compression-level = -1
      login-ratelimit = 3000
      connection-timeout = 5000
      read-timeout = 30000
      haproxy-protocol = false
      tcp-fast-open = false
      bungee-plugin-message-channel = true
      show-ping-requests = false
      failover-on-unexpected-server-disconnect = true
      announce-proxy-commands = true
      log-command-executions = false
      log-player-connections = true
      accepts-transfers = false

      [query]
      enabled = false
      port = 25577
      map = "Velocity"
      show-plugins = false

      [packet-limiter]
      interval = 7
      packets-per-second = -1
      bytes-per-second = -1
      decompressed-bytes-per-second = 5242880

      [ping-passthrough]
      version = false
      players = false
      description = false
      favicon = false
      modinfo = false

  velocity-forwarding-secret:
    content: "${VELOCITY_SECRET}"

  limbo-settings-yml:
    content: |
      bind:
        ip: '0.0.0.0'
        port: 25565
      maxPlayers: 100
      ping:
        description: '{"text": "&9Limbo"}'
        version: 'Limbo'
        protocol: -1
      dimension: THE_END
      playerList:
        enable: false
        username: 'Limbo'
      headerAndFooter:
        enable: false
        header: '{"text": ""}'
        footer: '{"text": ""}'
      gameMode: 2
      secureProfile: false
      brandName:
        enable: true
        content: 'Limbo'
      joinMessage:
        enable: false
        text: '{"text": ""}'
      bossBar:
        enable: false
        text: '{"text": ""}'
        health: 1.0
        color: PINK
        division: SOLID
      title:
        enable: false
        title: '{"text": ""}'
        subtitle: '{"text": ""}'
        fadeIn: 10
        stay: 100
        fadeOut: 10
      infoForwarding:
        type: MODERN
        secret: '${VELOCITY_SECRET}'
        tokens: []
      readTimeout: 30000
      debugLevel: 2
      netty:
        useEpoll: true
        threads:
          bossGroup: 1
          workerGroup: 4
      traffic:
        enable: true
        maxPacketSize: 8192
        interval: 7.0
        maxPacketRate: 500.0
        maxPacketBytesRate: 2048.0

services:
  velocity:
    container_name: "Velocity"
    image: itzg/mc-proxy:2026.11.2-java25
    environment:
      TYPE: "VELOCITY"
      MINECRAFT_VERSION: "26.1.2"
      # pinned: Velocity 4.3.1 build 45 · viaversion Fkfcr89K = 5.12.2 · viabackwards WFO37e8T = 5.12.2 ·
      # smartrejoin v6EKVYwb = 1.4.2 · Geyser 2.12.1 build 1309 · Floodgate 2.2.5 build 141.
      # a new Bedrock version needs a newer Geyser: bump its version and build here
      # (newest: https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest)
      VELOCITY_VERSION: "4.3.1"
      VELOCITY_BUILD_ID: "45"
      # the whitelist plugin reads these read-only (the API can't write anywhere in the proxy's folder)
      DS_WHITELIST_FILE: "/whitelist/whitelist.txt"
      DS_ARCHIVED_FILE: "/archived/archived.txt"
      MODRINTH_PROJECTS: |
        viaversion:Fkfcr89K
        viabackwards:WFO37e8T
        smartrejoin:v6EKVYwb
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1309/downloads/velocity
        https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/velocity
    configs:
      - source: velocity-toml
        target: /config/velocity.toml
      - source: velocity-forwarding-secret
        target: /config/forwarding.secret
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"
    volumes:
      - /data/minecraft/velocity:/server
      - /data/minecraft/whitelist/export:/whitelist:ro
      - /data/minecraft/archived:/archived:ro
    restart: unless-stopped
    networks:
      - mc-network

  mc-limbo:
    container_name: "MC-limbo"
    image: itzg/minecraft-server:2026.11.1
    environment:
      EULA: "TRUE"
      TYPE: "NANOLIMBO"
      MEMORY: "256M"
    configs:
      - source: limbo-settings-yml
        target: /data/settings.yml
    volumes:
      - /data/minecraft/limbo:/data
    restart: unless-stopped
    networks:
      - mc-network
    healthcheck:
      disable: true

  # the worlds. archiving one (mc-backup --archive NAME) needs nothing changed here: it lists the world
  # in /data/minecraft/archived/archived.txt (the proxy and the API read it) and sets MC_<NAME>=0 in .env,
  # so mc-up leaves its server off. a new world needs the same "deploy: replicas: ${MC_<NAME>:-1}" lines.
  mc-survival:
    container_name: "MC-survival"
    image: itzg/minecraft-server:2026.11.1
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      MEMORY: "4G"
      <<: *fabric-proxy-env
    volumes:
      - /data/minecraft/survival:/data
    # 0 when the world is archived (mc-backup --archive writes MC_SURVIVAL=0 to .env next to this file)
    deploy:
      replicas: ${MC_SURVIVAL:-1}
    restart: unless-stopped
    networks:
      - mc-network

  mc-anarchy:
    container_name: "MC-anarchy"
    image: itzg/minecraft-server:2026.11.1
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      MEMORY: "2G"
      <<: *fabric-proxy-env
    volumes:
      - /data/minecraft/anarchy:/data
    # 0 when the world is archived (mc-backup --archive writes MC_ANARCHY=0 to .env next to this file)
    deploy:
      replicas: ${MC_ANARCHY:-1}
    restart: unless-stopped
    networks:
      - mc-network

  mc-survival-old:
    container_name: "MC-survival-old"
    image: itzg/minecraft-server:2026.11.1
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      MEMORY: "2G"
      <<: *fabric-proxy-env
    volumes:
      - /data/minecraft/survival-old:/data
    # 0 when the world is archived (mc-backup --archive writes MC_SURVIVAL_OLD=0 to .env next to this file)
    deploy:
      replicas: ${MC_SURVIVAL_OLD:-1}
    restart: unless-stopped
    networks:
      - mc-network

  # status + whitelist requests for the website (mc-site repo, api/ folder)
  whitelist-api:
    container_name: "Whitelist-API"
    # the whole repo is the build context: the image also carries the admin page (see api/Dockerfile)
    build:
      context: ./mc-site
      dockerfile: api/Dockerfile
    # rebuild from the code on every mc-up; without this, up -d keeps running the image it built the first time
    pull_policy: build
    # built here, not pulled from a registry: nothing for Diun (update notices) to compare against
    labels:
      diun.enable: "false"
    environment:
      # secrets come from sops: run it with mc-up (sops exec-env ~/nixos-config/secrets.yaml)
      ADMIN_TOKEN: "${WHITELIST_ADMIN_TOKEN:?whitelist admin token required, add it to secrets.yaml}"
      # the second login step: the authenticator app's secret (server/admin-2fa.fish puts it in secrets.yaml);
      # empty = the token alone
      ADMIN_TOTP_SECRET: "${ADMIN_TOTP_SECRET:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      SITE_URL: "https://join.errornoslash.be"
      PUBLIC_API_URL: "https://mc-api.errornoslash.be"
      # the site, plus the ntfy web app (so its Approve / Deny buttons work in a browser too)
      ALLOWED_ORIGINS: "https://join.errornoslash.be,https://ntfy.errornoslash.be"
      # Nginx Proxy Manager passes the visitor's address in X-Real-IP
      CLIENT_IP_HEADER: "x-real-ip"
      # the admin only answers from these networks: the home network and Tailscale (IPv4 + IPv6).
      # using WireGuard on OPNsense instead? add its tunnel network, e.g. "10.10.10.0/24"
      ADMIN_NETWORKS: "10.0.0.0/24, 100.64.0.0/10, fd7a:115c:a1e0::/48"
      # first entry = the proxy everyone joins through; limbo is left out on purpose
      STATUS_SERVERS: "DS Network=velocity:25565, survival=mc-survival:25565, survival-old=mc-survival-old:25565, anarchy=mc-anarchy:25565"
      # your own ntfy, straight over the mc-api network (no TLS, no public hop)
      NTFY_URL: "http://Ntfy"
      NTFY_TOPIC: "mc-whitelist"
      NTFY_PRIORITY: "4"
      # where its files are: its own (read-write), whitelist.txt for the proxy, and the two it only reads
      EXPORT_DIR: "/data/export"
      SEEN_FILE: "/plugin/seen.tsv"
      ARCHIVED_FILE: "/archived/archived.txt"
    # least privilege: if the API were ever taken over, this is all it could touch.
    # it writes only its own folder (requests, whitelist, history, and export/whitelist.txt for the
    # proxy); the plugin's seen.tsv and the archived list are read-only; no worlds, no proxy folder
    volumes:
      - /data/minecraft/whitelist:/data
      - /data/minecraft/velocity/plugins/ds-whitelist:/plugin:ro
      - /data/minecraft/archived:/archived:ro
    restart: unless-stopped
    # read-only filesystem, a small /tmp nothing can run from, no Linux capabilities, no way to gain more
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # it can't eat the server: a quarter core, 256 MB, a few dozen processes
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    networks:
      - mc-network   # to ping the Minecraft servers
      - mc-api       # only Nginx Proxy Manager and Ntfy: not the rest of your services

networks:
  mc-network:
    driver: bridge
  # a small network of its own between the API, Nginx Proxy Manager and Ntfy, so the API can't reach
  # the rest of your services. made once with: docker network create mc-api; NPM and Ntfy join it in
  # your main compose file
  mc-api:
    name: mc-api
    external: true