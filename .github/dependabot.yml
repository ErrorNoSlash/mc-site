# Weekly pull requests when the pinned actions, the API's Node image, the server images or
# the plugin's dependencies have a new release. Review and merge them to stay current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly

  # the image tags in server/docker-compose.yml (the Minecraft servers and the proxy)
  - package-ecosystem: docker-compose
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /velocity-plugin
    schedule:
      interval: weekly
