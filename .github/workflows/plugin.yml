# builds the Velocity plugin; download the jar from the run's "Artifacts"
name: Build plugin

on:
  push:
    paths: ["velocity-plugin/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle --project-dir velocity-plugin build
      - uses: actions/upload-artifact@v4
        with:
          name: ds-whitelist
          path: velocity-plugin/build/libs/*.jar
