# If the site deploy or the plugin build still fails, run the failed jobs again
# (after a minute, up to 3 attempts in total), so a hiccup on GitHub's side fixes itself.
# It only re-runs an existing run: no code is checked out here.
name: Retry failed runs

on:
  workflow_run:
    workflows: ["Deploy site", "Build plugin"]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # re-run a workflow run
    steps:
      - name: Wait a minute, then re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          sleep 60
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
